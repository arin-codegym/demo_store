services:
  backend:
    image: ${BACKEND_IMAGE:-your-dockerhub/store-springboot-backend}:${BACKEND_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod

      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

      # On extra EC2 nodes these must point to shared infrastructure, not
      # service names from another machine's Docker network.
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD:-}

      WS_RELAY_ENABLED: ${WS_RELAY_ENABLED:-true}
      RABBITMQ_STOMP_HOST: ${RABBITMQ_STOMP_HOST}
      RABBITMQ_STOMP_PORT: ${RABBITMQ_STOMP_PORT:-61613}
      RABBITMQ_STOMP_LOGIN: ${RABBITMQ_STOMP_LOGIN}
      RABBITMQ_STOMP_PASSCODE: ${RABBITMQ_STOMP_PASSCODE}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}

      GEMINI_API_KEY: ${GEMINI_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      REFRESH_HASH_SECRET: ${REFRESH_HASH_SECRET}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      APP_MAIL_ENABLED: ${APP_MAIL_ENABLED}
      APP_MAIL_FROM: ${APP_MAIL_FROM}

      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}

      FRONTEND_URL: ${FRONTEND_URL}
      NEXT_REVALIDATE_PRODUCTS_URL: ${NEXT_REVALIDATE_PRODUCTS_URL}
      NEXT_REVALIDATE_SECRET: ${NEXT_REVALIDATE_SECRET}

      RAG_STORAGE_LOCAL_ROOT: /app/uploads/rag
    volumes:
      - uploads:/app/uploads

volumes:
  uploads:
