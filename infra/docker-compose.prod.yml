services:
  frontend:
    image: ${FRONTEND_IMAGE:-your-dockerhub/store-nextjs-frontend}:${FRONTEND_TAG:-latest}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      API_EXTERNAL: http://backend:8080/api/backend
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_KEY: ${NEXT_PUBLIC_SUPABASE_KEY}
      AWS_REGION: ${AWS_REGION}
      S3_PRODUCT_IMAGES_BUCKET: ${S3_PRODUCT_IMAGES_BUCKET}
      S3_PRODUCT_IMAGES_PUBLIC_BASE_URL: ${S3_PRODUCT_IMAGES_PUBLIC_BASE_URL}
      REVALIDATE_SECRET: ${NEXT_REVALIDATE_SECRET}
    depends_on:
      - backend

  backend:
    image: ${BACKEND_IMAGE:-your-dockerhub/store-springboot-backend}:${BACKEND_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      REFRESH_HASH_SECRET: ${REFRESH_HASH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      APP_MAIL_ENABLED: ${APP_MAIL_ENABLED}
      APP_MAIL_FROM: ${APP_MAIL_FROM}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      NEXT_REVALIDATE_PRODUCTS_URL: ${NEXT_REVALIDATE_PRODUCTS_URL}
      NEXT_REVALIDATE_SECRET: ${NEXT_REVALIDATE_SECRET}
      RAG_STORAGE_LOCAL_ROOT: /app/uploads/rag
    volumes:
      - uploads:/app/uploads
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

volumes:
  redis_data:
  uploads:
