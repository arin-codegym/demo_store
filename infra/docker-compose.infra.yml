services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${SPRING_DATA_REDIS_PORT:-6379}:6379"
    environment:
      REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD:-}
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
               redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
             else
               redis-server --appendonly yes;
             fi'
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    ports:
      - "${RABBITMQ_STOMP_PORT:-61613}:61613"
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_STOMP_LOGIN}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_STOMP_PASSCODE}
    command: >
      sh -c "rabbitmq-plugins enable --offline rabbitmq_stomp &&
             rabbitmq-server"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  redis_data:
  rabbitmq_data:
