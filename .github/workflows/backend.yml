name: Backend CI

on:
  push:
    branches: ['dev']
    paths:
      - 'apps/api/**'
      - 'infra/docker-compose.prod.yml'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: ['dev']
    paths:
      - 'apps/api/**'
      - 'infra/docker-compose.prod.yml'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

env:
  BACKEND_IMAGE: arin89/store-springboot-backend
  FRONTEND_IMAGE: arin89/store-nextjs-frontend

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    outputs:
      short_sha: ${{ steps.short_sha.outputs.short_sha }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Get short SHA
        id: short_sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout deploy files
        uses: actions/checkout@v4

      - name: Prepare EC2 app directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: mkdir -p /home/ubuntu/app

      - name: Copy production compose to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: infra/docker-compose.prod.yml
          target: /home/ubuntu/app
          strip_components: 1

      - name: Deploy backend and redis to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            if [ -f /home/ubuntu/docker-compose.yml ]; then
              cd /home/ubuntu
              docker compose down --remove-orphans || true
            fi

            cd /home/ubuntu/app
            mv docker-compose.prod.yml docker-compose.yml

            existing_frontend_tag=""
            if [ -f .env ]; then
              existing_frontend_tag=$(grep '^FRONTEND_TAG=' .env | cut -d= -f2- || true)
            fi

            cat > .env << 'EOF'
            ${{ secrets.PROD_ENV_FILE }}
            EOF

            upsert_env() {
              key="$1"
              value="$2"
              if grep -q "^${key}=" .env; then
                sed -i "s|^${key}=.*|${key}=${value}|" .env
              else
                echo "${key}=${value}" >> .env
              fi
            }

            upsert_env BACKEND_IMAGE "${{ env.BACKEND_IMAGE }}"
            upsert_env FRONTEND_IMAGE "${{ env.FRONTEND_IMAGE }}"
            upsert_env BACKEND_TAG "sha-${{ needs.build.outputs.short_sha }}"

            if [ -n "$existing_frontend_tag" ]; then
              upsert_env FRONTEND_TAG "$existing_frontend_tag"
            fi

            docker compose pull backend redis
            docker compose up -d --remove-orphans backend redis
            docker image prune -f
