name: Deploy Shared Infra

on:
  workflow_dispatch:

jobs:
  deploy_infra:
    name: Deploy Redis and RabbitMQ
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deploy files
        uses: actions/checkout@v4

      - name: Prepare EC2 infra directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_INFRA_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: mkdir -p /home/ubuntu/infra

      - name: Copy infra compose to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_INFRA_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: infra/docker-compose.infra.yml
          target: /home/ubuntu/infra
          strip_components: 1

      - name: Deploy Redis and RabbitMQ
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_INFRA_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/infra
            mv docker-compose.infra.yml docker-compose.yml

            cat > .env << 'EOF'
            ${{ secrets.INFRA_ENV_FILE }}
            EOF

            docker compose pull redis rabbitmq
            docker compose up -d --remove-orphans redis rabbitmq
            docker image prune -f
