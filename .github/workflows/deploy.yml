name: Full Stack CI/CD

on:
  push:
    branches: ['multiple-app']
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'infra/docker-compose.prod.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  BACKEND_IMAGE: arin89/store-springboot-backend
  FRONTEND_IMAGE: arin89/store-nextjs-frontend

jobs:
  backend_build:
    name: Build backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    outputs:
      short_sha: ${{ steps.short_sha.outputs.short_sha }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Get short SHA
        id: short_sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  backend_deploy:
    name: Deploy backend
    runs-on: ubuntu-latest
    needs: backend_build
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout deploy files
        uses: actions/checkout@v4

      - name: Prepare EC2 app directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: mkdir -p /home/ubuntu/app

      - name: Copy production compose to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: infra/docker-compose.prod.yml
          target: /home/ubuntu/app
          strip_components: 1

      - name: Deploy backend to app EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            if [ -f /home/ubuntu/docker-compose.yml ]; then
              cd /home/ubuntu
              docker compose down --remove-orphans || true
            fi

            cd /home/ubuntu/app
            mv docker-compose.prod.yml docker-compose.yml

            existing_frontend_tag=""
            if [ -f .env ]; then
              existing_frontend_tag=$(grep '^FRONTEND_TAG=' .env | cut -d= -f2- || true)
            fi

            cat > .env << 'EOF'
            ${{ secrets.PROD_ENV_FILE }}
            EOF

            upsert_env() {
              key="$1"
              value="$2"
              if grep -q "^${key}=" .env; then
                sed -i "s|^${key}=.*|${key}=${value}|" .env
              else
                echo "${key}=${value}" >> .env
              fi
            }

            upsert_env BACKEND_IMAGE "${{ env.BACKEND_IMAGE }}"
            upsert_env FRONTEND_IMAGE "${{ env.FRONTEND_IMAGE }}"
            upsert_env BACKEND_TAG "sha-${{ needs.backend_build.outputs.short_sha }}"

            if [ -n "$existing_frontend_tag" ]; then
              upsert_env FRONTEND_TAG "$existing_frontend_tag"
            fi

            echo "Disk usage before Docker cleanup:"
            df -h /
            docker system df || true
            docker system prune -af || true
            docker builder prune -af || true
            echo "Disk usage after Docker cleanup:"
            df -h /
            docker system df || true

            docker compose pull backend
            docker compose up -d --remove-orphans backend
            docker image prune -f

  frontend_build:
    name: Build frontend
    runs-on: ubuntu-latest
    needs:
      - backend_build
      - backend_deploy
    if: |
      always() &&
      needs.backend_build.result == 'success' &&
      (github.event_name == 'pull_request' || needs.backend_deploy.result == 'success')
    defaults:
      run:
        working-directory: apps/web
    outputs:
      short_sha: ${{ steps.short_sha.outputs.short_sha }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Wait for deployed backend
        if: github.event_name != 'pull_request'
        run: |
          for i in {1..30}; do
            if curl -fsS "${{ secrets.API_EXTERNAL_BUILD }}/product/fetchAllProducts" >/dev/null; then
              echo "Backend is ready."
              exit 0
            fi
            echo "Backend not ready yet. Retry $i/30..."
            sleep 5
          done
          echo "Backend did not become ready in time."
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          API_EXTERNAL: ${{ secrets.API_EXTERNAL_BUILD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_KEY }}
          NEXT_PUBLIC_BACKEND_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_URL_BUILD }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_PRODUCT_IMAGES_BUCKET: ${{ secrets.S3_PRODUCT_IMAGES_BUCKET }}
          S3_PRODUCT_IMAGES_PUBLIC_BASE_URL: ${{ secrets.S3_PRODUCT_IMAGES_PUBLIC_BASE_URL }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get short SHA
        id: short_sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_KEY }}
            API_EXTERNAL=${{ secrets.API_EXTERNAL_BUILD }}
            NEXT_PUBLIC_BACKEND_URL=${{ secrets.NEXT_PUBLIC_BACKEND_URL_BUILD }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
            AWS_REGION=${{ secrets.AWS_REGION }}
            S3_PRODUCT_IMAGES_BUCKET=${{ secrets.S3_PRODUCT_IMAGES_BUCKET }}
            S3_PRODUCT_IMAGES_PUBLIC_BASE_URL=${{ secrets.S3_PRODUCT_IMAGES_PUBLIC_BASE_URL }}

  frontend_deploy:
    name: Deploy frontend
    runs-on: ubuntu-latest
    needs:
      - backend_deploy
      - frontend_build
    if: github.event_name != 'pull_request' && needs.frontend_build.result == 'success'

    steps:
      - name: Deploy frontend to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd /home/ubuntu/app

            if [ ! -f docker-compose.yml ]; then
              echo "docker-compose.yml not found. Backend deploy should have created it."
              exit 1
            fi

            if [ ! -f .env ]; then
              echo ".env not found. Backend deploy should have created it."
              exit 1
            fi

            upsert_env() {
              key="$1"
              value="$2"
              if grep -q "^${key}=" .env; then
                sed -i "s|^${key}=.*|${key}=${value}|" .env
              else
                echo "${key}=${value}" >> .env
              fi
            }

            upsert_env FRONTEND_IMAGE "${{ env.FRONTEND_IMAGE }}"
            upsert_env FRONTEND_TAG "sha-${{ needs.frontend_build.outputs.short_sha }}"
            upsert_env SUPABASE_URL "${{ secrets.SUPABASE_URL }}"
            upsert_env SUPABASE_KEY "${{ secrets.SUPABASE_KEY }}"
            upsert_env NEXT_PUBLIC_SUPABASE_URL "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}"
            upsert_env NEXT_PUBLIC_SUPABASE_KEY "${{ secrets.NEXT_PUBLIC_SUPABASE_KEY }}"
            upsert_env NEXT_PUBLIC_BACKEND_URL "${{ secrets.NEXT_PUBLIC_BACKEND_URL_BUILD }}"
            upsert_env NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY "${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}"
            upsert_env AWS_REGION "${{ secrets.AWS_REGION }}"
            upsert_env S3_PRODUCT_IMAGES_BUCKET "${{ secrets.S3_PRODUCT_IMAGES_BUCKET }}"
            upsert_env S3_PRODUCT_IMAGES_PUBLIC_BASE_URL "${{ secrets.S3_PRODUCT_IMAGES_PUBLIC_BASE_URL }}"

            echo "Disk usage before Docker cleanup:"
            df -h /
            docker system df || true
            docker system prune -af || true
            docker builder prune -af || true
            echo "Disk usage after Docker cleanup:"
            df -h /
            docker system df || true

            docker compose pull frontend
            docker compose up -d frontend
            docker image prune -f
