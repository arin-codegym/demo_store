# Development profile.
# Defaults here are for local development only. Real keys can still be passed
# by environment variables without changing this file.

spring:
  ai:
    # Custom app property used by HybridRagRetriever.
    embedding:
      dimensions: ${AI_EMBEDDING_DIMENSIONS:1536}
    google:
      genai:
        # Set GEMINI_API_KEY locally when testing AI calls.
        api-key: ${GEMINI_API_KEY:dummy-dev-gemini-key}
        chat:
          options:
            model: ${GEMINI_CHAT_MODEL:gemini-2.5-flash}
            temperature: ${GEMINI_CHAT_TEMPERATURE:0.3}
        embedding:
          api-key: ${GEMINI_EMBEDDING_API_KEY:${GEMINI_API_KEY:dummy-dev-gemini-key}}
          text:
            options:
              model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
              dimensions: ${AI_EMBEDDING_DIMENSIONS:1536}

  datasource:
    # Override these when using Supabase or another remote database.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/store?prepareThreshold=0}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 60000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

  security:
    # Dev fallback is intentionally non-secret. Use REFRESH_HASH_SECRET outside local dev.
    refresh-hash-secret: ${REFRESH_HASH_SECRET:dev-refresh-hash-secret-change-me-32-bytes-min}
    oauth2:
      client:
        registration:
          google:
            # Dummy defaults keep local startup simple; real OAuth login needs env values.
            client-id: ${GOOGLE_CLIENT_ID:dev-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dev-google-client-secret}
            redirect-uri: "${FRONTEND_URL}/api/backend/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - email
              - profile

  rabbitmq:
    host: ${RABBITMQ_AMQP_HOST:${RABBITMQ_STOMP_HOST:localhost}}
    port: ${RABBITMQ_AMQP_PORT:5672}
    username: ${RABBITMQ_AMQP_USERNAME:${RABBITMQ_STOMP_LOGIN:store_ws}}
    password: ${RABBITMQ_AMQP_PASSWORD:${RABBITMQ_STOMP_PASSCODE:store_ws_password}}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 5
          multiplier: 2

ai:
  external-search:
    # Dev stays safe by default. Set AI_EXTERNAL_SEARCH_ENABLED=true and choose
    # a provider when testing live web research.
    enabled: ${AI_EXTERNAL_SEARCH_ENABLED:false}
    provider: ${AI_EXTERNAL_SEARCH_PROVIDER:noop}
    timeout-ms: ${AI_EXTERNAL_SEARCH_TIMEOUT_MS:5000}
    max-results: ${AI_EXTERNAL_SEARCH_MAX_RESULTS:5}
    google:
      endpoint: ${GOOGLE_CSE_ENDPOINT:https://www.googleapis.com/customsearch/v1}
      api-key: ${GOOGLE_CSE_API_KEY:}
      cx: ${GOOGLE_CSE_ID:}
    brave:
      endpoint: ${BRAVE_SEARCH_ENDPOINT:https://api.search.brave.com/res/v1/web/search}
      api-key: ${BRAVE_SEARCH_API_KEY:}
    tavily:
      endpoint: ${TAVILY_SEARCH_ENDPOINT:https://api.tavily.com/search}
      api-key: ${TAVILY_SEARCH_API_KEY:}
logging:
  level:
    root: INFO
    com.quochuy: DEBUG
    com.zaxxer.hikari: INFO
    com.quochuy.mybatis.interceptor.MyBatisSqlLogInterceptor: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoint:
    health:
      # Dev can show component details for quick debugging.
      show-details: always
      show-components: always

app:
  jwt:
    # HS256 needs a sufficiently long secret. Override in real environments.
    secret: ${JWT_SECRET:dev-jwt-secret-change-me-32-bytes-minimum}
    issuer: ${JWT_ISSUER:quochuy-store}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  websocket:
    relay:
      # Keep local dev runnable without RabbitMQ. Set WS_RELAY_ENABLED=true
      # when testing multi-instance WebSocket delivery through RabbitMQ.
      enabled: ${WS_RELAY_ENABLED:false}
      host: ${RABBITMQ_STOMP_HOST:localhost}
      port: ${RABBITMQ_STOMP_PORT:61613}
      login: ${RABBITMQ_STOMP_LOGIN:store_ws}
      passcode: ${RABBITMQ_STOMP_PASSCODE:store_ws_password}
      virtual-host: ${RABBITMQ_VHOST:/}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  chat:
    rabbit-events:
      enabled: ${CHAT_RABBIT_EVENTS_ENABLED:false}
  mail:
    enabled: ${APP_MAIL_ENABLED:false}
    from: ${APP_MAIL_FROM:no-reply@localhost}

stripe:
  secret:
    # Stripe API calls need real env values; placeholders are for app startup only.
    secret-key: ${STRIPE_SECRET_KEY:sk_test_dev_placeholder}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_dev_placeholder}

next:
  revalidate:
    products-url: ${NEXT_REVALIDATE_PRODUCTS_URL:http://localhost:3000/api/revalidate/products}
    secret: ${NEXT_REVALIDATE_SECRET:dev-revalidate-secret}
