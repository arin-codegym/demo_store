# Production profile.
# Pass values by Docker/Kubernetes environment variables. Required placeholders
# have no default on purpose so the app fails fast when a secret is missing.

spring:
  ai:
    # Custom app property used by HybridRagRetriever.
    embedding:
      dimensions: ${AI_EMBEDDING_DIMENSIONS:1536}
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: ${GEMINI_CHAT_MODEL:gemini-2.5-flash}
            temperature: ${GEMINI_CHAT_TEMPERATURE:0.3}
        embedding:
          api-key: ${GEMINI_EMBEDDING_API_KEY:${GEMINI_API_KEY}}
          text:
            options:
              model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
              dimensions: ${AI_EMBEDDING_DIMENSIONS:1536}

  datasource:
    # Example URL for Supabase pooler should be supplied via SPRING_DATASOURCE_URL.
    # Keep prepareThreshold=0 in the URL when using Supabase transaction pooler.
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 60000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  data:
    redis:
      # In docker-compose, redis is usually the service name.
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:2s}
      connect-timeout: ${SPRING_DATA_REDIS_CONNECT_TIMEOUT:2s}

  security:
    refresh-hash-secret: ${REFRESH_HASH_SECRET}
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "${FRONTEND_URL}/api/backend/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - email
              - profile

  mail:
    host: ${SPRING_MAIL_HOST}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  rabbitmq:
    # AMQP connection for internal backend events (@RabbitListener/RabbitTemplate).
    # This can point to the same RabbitMQ EC2 used by WebSocket STOMP relay, but uses port 5672.
    host: ${RABBITMQ_AMQP_HOST:${RABBITMQ_STOMP_HOST:rabbitmq}}
    port: ${RABBITMQ_AMQP_PORT:5672}
    username: ${RABBITMQ_AMQP_USERNAME:${RABBITMQ_STOMP_LOGIN}}
    password: ${RABBITMQ_AMQP_PASSWORD:${RABBITMQ_STOMP_PASSCODE}}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 5
          multiplier: 2

logging:
  level:
    root: INFO
    com.quochuy: INFO
    com.zaxxer.hikari: INFO
    com.quochuy.mybatis.interceptor.MyBatisSqlLogInterceptor: INFO
    org.springframework: WARN
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"

management:
  endpoint:
    health:
      # Do not expose DB/Redis details publicly in production.
      show-details: never
      show-components: never

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:quochuy-store}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  websocket:
    relay:
      enabled: ${WS_RELAY_ENABLED:true}
      host: ${RABBITMQ_STOMP_HOST:rabbitmq}
      port: ${RABBITMQ_STOMP_PORT:61613}
      login: ${RABBITMQ_STOMP_LOGIN}
      passcode: ${RABBITMQ_STOMP_PASSCODE}
      virtual-host: ${RABBITMQ_VHOST:/}
  frontend-url: ${FRONTEND_URL}
  chat:
    rabbit-events:
      # true = message.created realtime goes through RabbitMQ AMQP queue before WebSocket.
      # Set false to use the old direct AFTER_COMMIT -> WebSocket flow.
      enabled: ${CHAT_RABBIT_EVENTS_ENABLED:true}
  mail:
    enabled: ${APP_MAIL_ENABLED:true}
    from: ${APP_MAIL_FROM}

stripe:
  secret:
    secret-key: ${STRIPE_SECRET_KEY}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET}

next:
  revalidate:
    products-url: ${NEXT_REVALIDATE_PRODUCTS_URL}
    secret: ${NEXT_REVALIDATE_SECRET}
