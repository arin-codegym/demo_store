services:
  # Production runtime service for the Next.js frontend on EC2.
  # This compose file does not build frontend source code. It pulls the image
  # that the frontend repo has already built and pushed to Docker Hub.
  frontend:
    image: arin89/store-nextjs-frontend:${FRONTEND_TAG:-latest}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Internal container-to-container URL. The frontend server-side code can
      # call backend by service name because both containers share this compose network.
      API_EXTERNAL: http://backend:8080/api/backend
      # Public browser-facing backend URL. This value comes from /home/ubuntu/app/.env.
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
      # Supabase values used by frontend server-side utilities and public client config.
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_KEY: ${NEXT_PUBLIC_SUPABASE_KEY}
      AWS_REGION: ${AWS_REGION}
      S3_PRODUCT_IMAGES_BUCKET: ${S3_PRODUCT_IMAGES_BUCKET}
      S3_PRODUCT_IMAGES_PUBLIC_BASE_URL: ${S3_PRODUCT_IMAGES_PUBLIC_BASE_URL}
      # Backend calls /api/revalidate/products with NEXT_REVALIDATE_SECRET.
      # The Next.js route reads the same value as REVALIDATE_SECRET.
      REVALIDATE_SECRET: ${NEXT_REVALIDATE_SECRET}
    depends_on:
      - backend

  # Production runtime service for the Spring Boot backend on EC2.
  # It pulls arin89/store-springboot-backend:${BACKEND_TAG}; the backend GitHub
  # workflow writes BACKEND_TAG into /home/ubuntu/app/.env after each build.
  backend:
    image: arin89/store-springboot-backend:${BACKEND_TAG}
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Force Spring Boot to load application-prod.yml.
      SPRING_PROFILES_ACTIVE: prod

      # Supabase/Postgres connection values are injected from /home/ubuntu/app/.env.
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

      # Redis is another service in this compose file, so use service name "redis".
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      # AI/auth/provider secrets are injected from PROD_ENV_FILE -> EC2 .env.
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      REFRESH_HASH_SECRET: ${REFRESH_HASH_SECRET}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}

      # FRONTEND_URL is the public frontend origin used by backend auth/CORS/redirect logic.
      FRONTEND_URL: ${FRONTEND_URL}
      # Backend calls this URL to ask Next.js to revalidate cached product data.
      NEXT_REVALIDATE_PRODUCTS_URL: ${NEXT_REVALIDATE_PRODUCTS_URL}
      NEXT_REVALIDATE_SECRET: ${NEXT_REVALIDATE_SECRET}

      # Store uploaded/RAG files inside a Docker volume mounted at /app/uploads.
      RAG_STORAGE_LOCAL_ROOT: /app/uploads/rag
    volumes:
      - uploads:/app/uploads
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

volumes:
  # Keeps Redis data and uploaded/RAG files after container restart/recreate.
  redis_data:
  uploads:
