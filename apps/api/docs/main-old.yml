name: Backend CI

on:
  push:
    branches: [ "session" ]
  pull_request:
    branches: [ "session" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.short_sha.outputs.short_sha }}
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Get short SHA
        id: short_sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: arin89/store-springboot-backend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'

    steps:
      - name: Deploy backend to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu

            if [ ! -f .env ]; then
              touch .env
            fi

            # if grep -q '^BACKEND_TAG=' .env; then
            #   sed -i "s/^BACKEND_TAG=.*/BACKEND_TAG=${{ needs.build.outputs.short_sha }}/" .env
            # else
            #   echo "BACKEND_TAG=${{ needs.build.outputs.short_sha }}" >> .env
            # fi
            # cat .env
            
            upsert_env() {
              key="$1"
              value="$2"
              if grep -q "^${key}=" .env; then
                sed -i "s|^${key}=.*|${key}=${value}|" .env
              else
                echo "${key}=${value}" >> .env
              fi
            }

            upsert_env BACKEND_TAG "sha-${{ needs.build.outputs.short_sha }}"
            upsert_env STRIPE_SECRET_KEY "${{ secrets.STRIPE_SECRET_KEY }}"
            upsert_env STRIPE_WEBHOOK_SECRET "${{ secrets.STRIPE_WEBHOOK_SECRET }}"
            upsert_env FRONTEND_URL "http://${{ secrets.EC2_HOST }}"

            docker compose pull backend
            docker compose up -d backend
            docker image prune -f

